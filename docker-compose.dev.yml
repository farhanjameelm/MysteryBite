version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mysterybite-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mysterybite

  backend:
    build: ./backend
    container_name: mysterybite-backend-dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/mysterybite
      JWT_SECRET: dev_secret_key_change_in_production
      JWT_EXPIRE: 7d
      FRONTEND_URL: http://localhost:3000
    command: npm run dev
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: mysterybite-frontend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    command: npm run dev
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongodb-data:
